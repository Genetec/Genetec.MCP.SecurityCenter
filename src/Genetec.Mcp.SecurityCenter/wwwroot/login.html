<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Center &mdash; Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fefefe;
            background-color: #04121d;
        }

        #layout {
            height: 100svh;
            background-image: url("/images/SaaS-Background.png");
            background-position: top left;
            background-size: cover;
            display: grid;
            grid-template-areas:
                "logo"
                "main"
                "footer";
            grid-template-rows: 1fr minmax(0, auto) 1fr;
            gap: 24px 0;
        }

        header {
            grid-area: logo;
            padding: 32px 40px 0;
        }

        main {
            grid-area: main;
            overflow: auto;
        }

        footer {
            display: grid;
            grid-area: footer;
            align-content: end;
            padding: 0 32px 40px;
        }

        .logo {
            height: 48px;
        }

        #loginForm {
            margin: 0 auto;
            max-width: 416px;
            padding: 0 40px;
        }

        .marketing {
            margin-bottom: 24px;
        }

        .marketing h2 {
            font-size: 1.75rem;
            font-weight: 600;
            line-height: 1.3;
            color: #fefefe;
        }

        .error-message {
            background: rgba(249, 93, 93, 0.15);
            border: 1px solid rgba(249, 93, 93, 0.4);
            border-radius: 4px;
            color: #F95D5D;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 0.875rem;
        }

        .security-notice {
            border: 1px solid rgba(0, 174, 239, 0.5);
            background: rgba(0, 174, 239, 0.1);
            border-radius: 4px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 0.8125rem;
            line-height: 1.5;
        }

        .security-notice h3 { font-size: 0.875rem; margin-bottom: 8px; }
        .security-notice p + p { margin-top: 8px; }
        .connection-warning {
            border-color: rgba(255, 193, 7, 0.6);
            background: rgba(255, 193, 7, 0.1);
            color: #ffe39a;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 0.875rem;
            font-weight: 400;
            color: rgba(254, 254, 254, 0.6);
            margin-bottom: 6px;
        }

        .field input[type="text"],
        .field input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
            color: #fefefe;
            background: #1e242d;
            border: 1px solid rgba(254, 254, 254, 0.15);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s;
        }

        .field input[type="text"]:focus,
        .field input[type="password"]:focus {
            border-color: #00aeef;
        }

        .field input::placeholder {
            color: rgba(254, 254, 254, 0.3);
        }

        .scope-section {
            margin-bottom: 20px;
        }

        .scope-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .scope-section-header label {
            font-size: 0.875rem;
            font-weight: 400;
            color: rgba(254, 254, 254, 0.6);
        }

        .scope-toggle {
            font-size: 0.75rem;
            color: #00aeef;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
        }

        .scope-toggle:hover {
            text-decoration: underline;
        }

        .scope-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .scope-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .scope-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #00aeef;
            cursor: pointer;
            flex-shrink: 0;
        }

        .scope-item span {
            font-size: 0.8125rem;
            color: rgba(254, 254, 254, 0.8);
            user-select: none;
        }

        .btn-signin {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: #04121d;
            background: #00aeef;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-signin:hover {
            background: #0091c6;
        }

        .btn-signin:active {
            background: #007aa8;
        }

        .btn-signin:disabled { opacity: 0.75; cursor: wait; }

        .signin-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(4, 18, 29, 0.3);
            border-top-color: #04121d;
            border-radius: 50%;
            animation: signin-spin 0.8s linear infinite;
        }

        @keyframes signin-spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .signin-spinner { animation: none; }
        }

        #footer-content {
            display: flex;
            flex-wrap: wrap;
            gap: 0 16px;
            justify-content: center;
        }

        #footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0 16px;
            justify-content: center;
        }

        .footer-text {
            white-space: nowrap;
            font-size: 0.8125rem;
            color: rgba(254, 254, 254, 0.3);
        }

        .footer-link {
            white-space: nowrap;
            font-size: 0.8125rem;
            color: rgba(254, 254, 254, 0.6);
            text-decoration: none;
            transition: color 0.15s;
        }

        .footer-link:hover {
            color: #fefefe;
        }

        @media screen and (max-width: 600px) {
            .logo { height: 40px; }
            #layout { background-image: none; }
            .marketing h2 { font-size: 1.375rem; }
        }
    </style>
</head>
<body>
    <div id="layout">
        <header>
            <img class="logo" alt="Genetec Security Center Logo" src="/images/LogoSecurityCenter.svg" />
        </header>
        <main>
            <form id="loginForm" method="POST" action="/authorize" onsubmit="return assembleScope()">
                {{CSRF_TOKEN}}
                <div class="marketing">
                    <h2>Sign in with your Security Center credentials</h2>
                </div>
                <aside class="security-notice" aria-labelledby="agentNoticeTitle">
                    <h3 id="agentNoticeTitle">{{AGENT_ACCESS_TITLE}}</h3>
                    <p>{{AGENT_ACCESS_MESSAGE}}</p>
                </aside>
                {{BROWSER_HTTP_WARNING}}
                {{CONNECTION_WARNINGS}}
                {{ERROR}}
                <input type="hidden" name="redirect_uri" value="{{REDIRECT_URI}}" />
                <input type="hidden" name="state" value="{{STATE}}" />
                <input type="hidden" name="code_challenge" value="{{CODE_CHALLENGE}}" />
                <input type="hidden" name="code_challenge_method" value="{{CODE_CHALLENGE_METHOD}}" />
                <input type="hidden" name="client_id" value="{{CLIENT_ID}}" />
                <input type="hidden" id="scopeField" name="scope" value="" />
                <div class="field">
                    <label for="host">Security Center Host</label>
                    <input type="text" id="host" name="host" required autocomplete="off" placeholder="e.g. 192.168.1.10 or 192.168.1.10:4590" value="{{HOST}}"{{HOST_READONLY}} />
                </div>
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" />
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" />
                </div>
                <div class="scope-section">
                    <div class="scope-section-header">
                        <label>Tool access</label>
                        <button type="button" class="scope-toggle" onclick="toggleAllScopes(this)">Deselect all</button>
                    </div>
                    <div class="scope-grid">
                        {{SCOPES}}
                    </div>
                    <div id="scopeError" class="error-message" style="display:none; margin-top: 10px;"></div>
                </div>
                <button id="signinButton" class="btn-signin" type="submit">
                    <span id="signinSpinner" class="signin-spinner" aria-hidden="true" hidden></span>
                    <span id="signinLabel" aria-live="polite">Sign in</span>
                </button>
            </form>
        </main>
        <footer>
            <div id="footer-content">
                <span class="footer-text">&copy;2026 Genetec Inc. All rights reserved</span>
                <div id="footer-links">
                    <a class="footer-link" href="https://www.genetec.com/legal/tos" target="_blank">Terms of Service</a>
                    <a class="footer-link" href="https://www.genetec.com/legal/privacy" target="_blank">Privacy Policy</a>
                </div>
            </div>
        </footer>
    </div>
    <script>
        var browserHttpWarning = document.getElementById('browserHttpWarning');
        if (browserHttpWarning && window.location.protocol === 'http:') {
            browserHttpWarning.hidden = false;
        }

        var hostField = document.getElementById("host");
        if (hostField.value) document.getElementById("username").focus();
        else hostField.focus();

        function assembleScope() {
            if (document.getElementById('signinButton').disabled) return false;
            var checked = Array.from(document.querySelectorAll('.scope-checkbox:checked')).map(function(cb) { return cb.value; });
            var errorEl = document.getElementById('scopeError');
            if (checked.length === 0) {
                errorEl.textContent = 'Please select at least one scope to continue.';
                errorEl.style.display = 'block';
                return false;
            }
            errorEl.style.display = 'none';
            document.getElementById('scopeField').value = checked.join(' ');
            setSigninLoading(true);
            return true;
        }

        function setSigninLoading(loading) {
            document.getElementById('signinButton').disabled = loading;
            document.getElementById('signinSpinner').hidden = !loading;
            document.getElementById('signinLabel').textContent = loading ? 'Signing in…' : 'Sign in';
            document.getElementById('loginForm').setAttribute('aria-busy', String(loading));
        }

        window.addEventListener('pageshow', function() { setSigninLoading(false); });

        function toggleAllScopes(btn) {
            var checkboxes = document.querySelectorAll('.scope-checkbox');
            var anyUnchecked = Array.from(checkboxes).some(function(cb) { return !cb.checked; });
            checkboxes.forEach(function(cb) { cb.checked = anyUnchecked; });
            btn.textContent = anyUnchecked ? 'Deselect all' : 'Select all';
        }
    </script>
</body>
</html>
